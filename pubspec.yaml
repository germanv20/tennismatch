name: tennismatch
description: "A new Flutter project."
publish_to: 'none'

version: 1.2.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  country_picker: ^2.0.20

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.0.6
  firebase_messaging: ^16.2.0
  firebase_storage: ^13.3.0
  firebase_app_check: ^0.4.3
  image_picker: ^1.1.2
  url_launcher: ^6.2.5
  shared_preferences: ^2.3.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icon/icon.png"