org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Pin Gradle to a dedicated JDK 21 install instead of the system JDK.
# Gradle 8.12 (see gradle-wrapper.properties) can't run on very new JDKs
# (e.g. system-wide OpenJDK 25.0.3 — and, as of the Sept 2026 Android
# Studio update, its own bundled JBR is now 25.0.3 too), which fails the
# build with a cryptic "What went wrong: <jdk version>" error and no other
# detail. Installed via `winget install --id EclipseAdoptium.Temurin.21.JDK`.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.101-hotspot
